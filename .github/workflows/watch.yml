name: zelda-watch

on:
  schedule:
    - cron: "3-59/5 * * * *" # cada 5 min, desfasado de :00/:05 (minutos más cargados de GitHub)
    - cron: "0 15 * * 1"     # heartbeat: lunes 12:00 Chile, "sigo vivo" a Discord
  workflow_dispatch:
    inputs:
      test:
        description: "Mandar mensaje de prueba a Discord"
        type: boolean
        default: false
      product_id:
        description: "ID de catálogo /p/MLC... a vigilar (vacío = Zelda)"
        type: string
        default: ""

permissions:
  contents: write   # guardar seen.json
  actions: read     # ver si la corrida anterior falló (anti-spam de alertas)

concurrency:
  group: zelda-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python watch.py --selfcheck && python test_watch.py
      - run: python watch.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          TEST: ${{ inputs.test && '1' || '0' }}
          PRODUCT_ID: ${{ inputs.product_id }}
          HEARTBEAT: ${{ github.event.schedule == '0 15 * * 1' && '1' || '0' }}
      - name: Guardar seen.json
        run: |
          git config user.name "zelda-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "seen: update"
          # repo público: GitHub apaga el cron tras 60 días sin commits; commit semanal lo mantiene vivo
          elif [ "${{ github.event.schedule }}" = "0 15 * * 1" ]; then git commit --allow-empty -m "keepalive"
          else exit 0; fi
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Avisar falla a Discord
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          prev=$(gh run list --workflow watch.yml --status completed -L 1 --json conclusion -q '.[0].conclusion')
          if [ "$prev" = "failure" ]; then echo "la anterior ya falló y avisó, no repetir"; exit 0; fi
          curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" \
            -d "{\"content\":\"⚠️ zelda_scrap falló, no está vigilando. Log: $RUN_URL\",\"allowed_mentions\":{\"parse\":[]}}"
